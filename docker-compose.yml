services:
  postgres:
    image: postgres:17-alpine
    container_name: missionscout-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: missionscout
      POSTGRES_PASSWORD: missionscout
      POSTGRES_DB: missionscout
    ports:
      - "5434:5432"
    volumes:
      - missionscout_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U missionscout -d missionscout"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: missionscout-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - missionscout_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  missionscout_postgres_data:
  missionscout_redis_data:
